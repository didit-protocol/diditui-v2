name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # id-token: write lets npm exchange the GitHub OIDC token for a short-lived
    # publish credential (npm Trusted Publishing, needs npm >= 11.5.1).
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Cache pnpm setup
        uses: pnpm/action-setup@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC only (npm Trusted Publishing): no npm token and no registry-url, so no
          # _authToken line is written to .npmrc and npm uses the OIDC exchange.
          NPM_CONFIG_PROVENANCE: "true"
          HUSKY: 0
